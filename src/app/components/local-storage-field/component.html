<div class="info" [class.has-checkbox]="isCheckbox" [attr.label]="label">
    <ng-container *ngIf="!isCheckbox; else checkboxTpl">
        <input class="lsf-input" [type]="type" [formControl]="ctrl" [placeholder]="placeholder || ''"
            [autocomplete]="autocomplete" />
    </ng-container>

    <ng-template #checkboxTpl>
        <div class="checkbox-row">
            <input type="checkbox" [id]="cid" [formControl]="ctrl" />
            <label [for]="cid">{{ label }}</label>
        </div>
    </ng-template>

    <div class="actions">
        <button type="button" (click)="saveNow()" [disabled]="!dirty" *ngIf="!autosave">Save</button>
        <button type="button" (click)="resetToStored()" *ngIf="!autosave">Reset</button>
    </div>

    <span class="status" *ngIf="status">{{ status }}</span>
</div>
