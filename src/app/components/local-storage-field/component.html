<label class="lsf-label">
    <span class="lsf-title">{{ label }}</span>
    <input class="lsf-input" [type]="type" [placeholder]="placeholder || ''" [formControl]="ctrl"
        [attr.autocomplete]="autocomplete" />
</label>

<div class="lsf-actions">
    <button type="button" (click)="saveNow()" [disabled]="!dirty" *ngIf="!autosave">Save</button>
    <button type="button" (click)="resetToStored()" *ngIf="!autosave">Reset</button>
</div>
<span class="lsf-status" *ngIf="status">{{ status }}</span>
