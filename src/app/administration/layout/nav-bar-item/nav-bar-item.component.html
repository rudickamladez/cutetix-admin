@if (item.customFunc == null) {
  <a [routerLink]="item.link" routerLinkActive="active">
    <fa-icon [icon]="item.icon"></fa-icon>
    {{item.name}}
  </a>
}
@if (item.customFunc != null) {
  <a (click)="item.customFunc()">
    <fa-icon [icon]="item.icon"></fa-icon>
    {{item.name}}
  </a>
}
<div class="subitems">
  <ng-content></ng-content>
</div>
