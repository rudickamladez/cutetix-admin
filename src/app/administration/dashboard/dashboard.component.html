<div class="container">
    <!-- TODO: Favourite events by user -->
    @let user = usersService.user.value()!;
    @if (user) {
    @if (user.favorite_events) {
    @for (event of user.favorite_events; track $index) {
    <app-dashboard-event-overview [event_id]="event.id"></app-dashboard-event-overview>
    }
    } @else {
    <p>No favorite events found.</p>
    }
    } @else {
    <p>Loading user information...</p>
    }
</div>
