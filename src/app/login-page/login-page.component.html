<h1 class="title">CuteTix admin interface</h1>

@if (loginFailed || !canRun()) {
<div class="error">
  <p>
    {{ errorText }}
  </p>
</div>
}

@if (canRun() && !showConfig()) {
<div class="window">
  <h2 class="ignore-mobile">Login</h2>
  <p>You must be logged in to enter the system.</p>
  <form [formGroup]="loginForm" (submit)="loginWithPassword()">
    <input type="text" formControlName="username" placeholder="Username">
    <input type="password" formControlName="password" placeholder="Password"
      [ngClass]="{'sudo-mode': storageService.getBoolean(keys.SUDO_PASSWORD_MODE)}">
    <button class="alt" [disabled]="(!loginForm.value.username) || (!loginForm.value.password) || loggingIn">
      @if (!loggingIn) {
      <fa-icon [icon]="loginIcon"></fa-icon>
      }
      @if (!loggingIn) {
      <span>Log in</span>
      }
      @if (loggingIn) {
      <fa-icon [icon]="loadingIcon"></fa-icon>
      }
    </button>
  </form>
</div>
}

<button class="config" (click)="toggleConfigVisibility()">
  <fa-icon [icon]="settingsIcon"></fa-icon>
</button>

@if (showConfig()) {
<div class="window">
  <h2 class="ignore-mobile">Config</h2>
  <app-local-storage-field [key]="keys.API_URL" label="API URL" type="url" />
  <app-local-storage-field [key]="keys.BROWSER_CORE_CHECK" label="BROWSER_CORE_CHECK" type="checkbox" />
  <app-local-storage-field [key]="keys.SUDO_PASSWORD_MODE" label="SUDO_PASSWORD_MODE" type="checkbox" />
</div>
}
<app-copyright></app-copyright>
